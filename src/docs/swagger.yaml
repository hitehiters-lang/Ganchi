basePath: /
definitions:
  models.BlogAuthor:
    properties:
      avatar:
        type: string
      id:
        type: integer
      name:
        type: string
    type: object
  models.BlogCategory:
    properties:
      id:
        type: integer
      name:
        description: заполняется переводом
        type: string
      slug:
        type: string
    type: object
  models.BlogPostDetail:
    properties:
      author:
        $ref: '#/definitions/models.BlogAuthor'
      blogPicturePathLinux:
        type: string
      blogPicturePathWindows:
        type: string
      category:
        $ref: '#/definitions/models.BlogCategory'
      content:
        type: string
      id:
        type: integer
      publishedAt:
        type: string
      seo:
        $ref: '#/definitions/models.BlogSEO'
      slug:
        type: string
      tags:
        items:
          $ref: '#/definitions/models.BlogTag'
        type: array
      title:
        type: string
    type: object
  models.BlogPostListItem:
    properties:
      author:
        $ref: '#/definitions/models.BlogAuthor'
      blogPicturePathLinux:
        type: string
      blogPicturePathWindows:
        type: string
      category:
        $ref: '#/definitions/models.BlogCategory'
      excerpt:
        type: string
      id:
        type: integer
      publishedAt:
        type: string
      slug:
        type: string
      title:
        type: string
    type: object
  models.BlogPostResponse:
    properties:
      data:
        $ref: '#/definitions/models.BlogPostDetail'
    type: object
  models.BlogPostsResponse:
    properties:
      data:
        items:
          $ref: '#/definitions/models.BlogPostListItem'
        type: array
      meta:
        $ref: '#/definitions/models.PaginationMeta'
    type: object
  models.BlogSEO:
    properties:
      metaDescription:
        type: string
      metaTitle:
        type: string
    type: object
  models.BlogTag:
    properties:
      id:
        type: integer
      name:
        type: string
      slug:
        type: string
    type: object
  models.Comment:
    properties:
      content:
        type: string
      createdAt:
        type: string
      id:
        type: integer
      name:
        type: string
      parentId:
        type: integer
      replies:
        description: Вложенные комментарии (заполняются при сборке дерева)
        items:
          $ref: '#/definitions/models.Comment'
        type: array
    type: object
  models.CommentCreateRequest:
    properties:
      content:
        type: string
      email:
        type: string
      name:
        type: string
      parentId:
        type: integer
    type: object
  models.CommentResponse:
    properties:
      comments:
        items:
          $ref: '#/definitions/models.Comment'
        type: array
      total:
        type: integer
    type: object
  models.Loader:
    properties:
      autoWeight:
        type: integer
      batteryType:
        type: string
      brakeType:
        type: string
      chargingTime:
        type: string
      engineType:
        type: string
      forkLength:
        type: integer
      frontWheels:
        type: string
      height:
        type: integer
      hydraulicLiftingEngine:
        type: string
      id:
        type: integer
      length:
        type: integer
      liftHeight:
        type: integer
      liftingAngle:
        type: integer
      liftingCylinder:
        type: string
      longmenFrameMaterial:
        type: integer
      maxLiftWeight:
        type: integer
      name:
        type: string
      picturePathLinux:
        type: string
      picturePathWindows:
        type: string
      price:
        type: integer
      rearWheels:
        type: string
      steeringMode:
        type: string
      turningRadius:
        type: integer
      voltage:
        type: integer
      wheelAxis:
        type: string
      width:
        type: integer
      workingHours:
        type: string
    type: object
  models.ManualLoader:
    properties:
      brakeType:
        type: string
      control:
        type: string
      driveGear:
        type: string
      forkLength:
        type: integer
      forkWidth:
        type: integer
      id:
        type: integer
      length:
        type: integer
      liftingSpeed:
        type: integer
      maxLiftWeight:
        type: integer
      maxSpeed:
        format: float64
        type: number
      name:
        type: string
      picturePathLinux:
        type: string
      picturePathWindows:
        type: string
      price:
        type: integer
    type: object
  models.PaginationMeta:
    properties:
      page:
        type: integer
      perPage:
        type: integer
      total:
        type: integer
      totalPages:
        type: integer
    type: object
info:
  contact: {}
  description: Документация к API.
  title: Gangchi API
  version: "0.2"
paths:
  /api/blog/categories:
    get:
      consumes:
      - application/json
      description: Возвращает все категории блога с переводом
      operationId: get_blog_categories
      parameters:
      - default: ru
        description: 'Язык: ru, en, kk, zh'
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.BlogCategory'
            type: array
      summary: Получить список категорий
      tags:
      - Блог
  /api/blog/posts:
    get:
      consumes:
      - application/json
      description: Возвращает список статей с пагинацией, фильтрацией по категориям
        и переводом
      operationId: get_blog_posts
      parameters:
      - default: 1
        description: Страница
        in: query
        name: page
        type: integer
      - default: 10
        description: На странице
        in: query
        name: perPage
        type: integer
      - collectionFormat: multi
        description: Слаги категорий (можно несколько)
        in: query
        items:
          type: string
        name: category
        type: array
      - default: ru
        description: 'Язык: ru, en, kk, zh'
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BlogPostsResponse'
      summary: Получить список статей
      tags:
      - Блог
  /api/blog/posts/{slug}:
    get:
      consumes:
      - application/json
      description: Возвращает полную статью с тегами, переводом и SEO
      operationId: get_blog_post_by_slug
      parameters:
      - description: Слаг статьи
        in: path
        name: slug
        required: true
        type: string
      - default: ru
        description: 'Язык: ru, en, kk, zh'
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.BlogPostResponse'
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить статью по слагу
      tags:
      - Блог
  /api/blog/posts/{slug}/comments:
    get:
      consumes:
      - application/json
      description: Возвращает плоский список всех комментариев с parentId
      operationId: get_post_comments
      parameters:
      - description: Слаг статьи
        in: path
        name: slug
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/models.CommentResponse'
      summary: Получить комментарии к статье
      tags:
      - Блог
    post:
      consumes:
      - application/json
      description: Добавляет новый комментарий (требует модерации)
      operationId: create_post_comment
      parameters:
      - description: Слаг статьи
        in: path
        name: slug
        required: true
        type: string
      - description: Данные комментария
        in: body
        name: comment
        required: true
        schema:
          $ref: '#/definitions/models.CommentCreateRequest'
      produces:
      - application/json
      responses:
        "201":
          description: Created
          schema:
            $ref: '#/definitions/models.Comment'
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Создать комментарий к статье
      tags:
      - Блог
  /api/blog/posts/{slug}/cover:
    get:
      description: Отправляет изображение обложки поста с указанным слагом
      operationId: get_blog_cover_image
      parameters:
      - description: Slug
        in: path
        name: slug
        required: true
        type: string
      produces:
      - image/png
      - image/jpeg
      - image/webp
      responses:
        "200":
          description: OK
          schema:
            type: file
        "400":
          description: Bad Request
          schema:
            additionalProperties:
              type: string
            type: object
        "404":
          description: Not Found
          schema:
            additionalProperties:
              type: string
            type: object
      summary: Получить фото обложки статьи по слагy
      tags:
      - Блог
  /api/loaders/getall:
    get:
      consumes:
      - application/json
      description: Отправляет всю таблицу с данными о каждом погрузчике
      operationId: all_loaders
      parameters:
      - description: Языковой код
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Loader'
            type: array
      summary: Получить все погрузчики
      tags:
      - Электрические погрузчики
  /api/loaders/getimage/{loader_id}:
    get:
      description: Отправляет фото погрузчика с указанным id
      operationId: loader_image
      parameters:
      - description: ID погрузчика
        example: "1"
        in: path
        name: loader_id
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Получить фото погрузчика по id
      tags:
      - Электрические погрузчики
  /api/manual_loaders/getall:
    get:
      consumes:
      - application/json
      description: Отправляет всю таблицу с данными о каждом погрузчике
      operationId: all_manual_loaders
      parameters:
      - description: Языковой код
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ManualLoader'
            type: array
      summary: Получить все ручные погрузчики
      tags:
      - Ручные погрузчики
  /api/manual_loaders/getimage/{loader_id}:
    get:
      description: Отправляет фото погрузчика с указанным id
      operationId: get_manual_loader_image
      parameters:
      - description: ID ручного погрузчика
        example: "1"
        in: path
        name: loader_id
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Получить фото ручного погрузчика по id
      tags:
      - Ручные погрузчики
swagger: "2.0"
