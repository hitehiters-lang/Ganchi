info:
  contact: {}
  description: Документация к API.
  title: Gangchi API
  version: "0.1"
paths:
  /api/loaders/getall:
    get:
      consumes:
      - application/json
      description: Отправляет всю таблицу с данными о каждом погрузчике
      operationId: all_loaders
      parameters:
      - description: Языковой код
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.Loader'
            type: array
      summary: Получить все погрузчики
      tags:
      - Электрические погрузчики
  /api/loaders/getimage/{loader_id}:
    get:
      description: Отправляет фото погрузчика с указанным id
      operationId: loader_image
      parameters:
      - description: ID погрузчика
        example: "1"
        in: path
        name: loader_id
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Получить фото погрузчика по id
      tags:
      - Электрические погрузчики
  /api/manual_loaders/getall:
    get:
      consumes:
      - application/json
      description: Отправляет всю таблицу с данными о каждом погрузчике
      operationId: all_manual_loaders
      parameters:
      - description: Языковой код
        in: query
        name: lang
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            items:
              $ref: '#/definitions/models.ManualLoader'
            type: array
      summary: Получить все ручные погрузчики
      tags:
      - Ручные погрузчики
  /api/manual_loaders/getimage/{loader_id}:
    get:
      description: Отправляет фото погрузчика с указанным id
      operationId: get_manual_loader_image
      parameters:
      - description: ID ручного погрузчика
        example: "1"
        in: path
        name: loader_id
        required: true
        type: string
      produces:
      - image/png
      responses:
        "200":
          description: OK
          schema:
            type: file
      summary: Получить фото ручного погрузчика по id
      tags:
      - Ручные погрузчики
securityDefinitions:
  BearerAuth:
    description: Введите JWT токен
    in: header
    name: Authorization
    type: apiKey
swagger: "2.0"
