basePath: /
definitions:
  models.Loader:
    properties:
      autoWeight:
        type: integer
      batteryType:
        type: string
      brakeType:
        type: string
      chargingTime:
        type: string
      engineType:
        type: string
      forkLength:
        type: integer
      frontWheels:
        type: string
      height:
        type: integer
      hydraulicLiftingEngine:
        type: string
      id:
        type: integer
      length:
        type: integer
      liftHeight:
        type: integer
      liftingAngle:
        type: integer
      liftingCylinder:
        type: string
      longmenFrameMaterial:
        type: integer
      maxLiftWeight:
        type: integer
      name:
        type: string
      picturePathLinux:
        type: string
      picturePathWindows:
        type: string
      price:
        type: integer
      rearWheels:
        type: string
      steeringMode:
        type: string
      turningRadius:
        type: integer
      voltage:
        type: integer
      wheelAxis:
        type: string
      width:
        type: integer
      workingHours:
        type: string
    type: object
  models.ManualLoader:
    properties:
      brakeType:
        type: string
      control:
        type: string
      driveGear:
        type: string
      forkLength:
        type: integer
      forkWidth:
        type: integer
      id:
        type: integer
      length:
        type: integer
      liftingSpeed:
        type: integer
      maxLiftWeight:
        type: integer
      maxSpeed:
